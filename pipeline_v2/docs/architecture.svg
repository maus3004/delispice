<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img">
<title>pipeline_v2 architecture</title>
<desc>TrackMan FTP v3 folders feed download.py, which writes every file into raw/. load.py turns pitch CSVs into one parquet per game in games/. build.py rebuilds changed years into serving/ plus the RE288 matrix. Model artifacts are re-scored nightly and retrained monthly, and the app is refreshed with warm caches and a graceful reload. Every step records into the pipeline.db ledger, which feeds status, the pipeline page and Discord alerts. An always-on heights service reads serving/ and writes heights.csv for the app.</desc>
<style>
.t{font:600 14px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.s{font:400 12px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font:600 16px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="900" rx="12" fill="#FFFFFF"/>
<text class="h" x="40" y="36" fill="#2C2C2A">pipeline_v2: architecture</text>

<g><rect x="60" y="60" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text class="t" x="210" y="80" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">TrackMan FTP</text><text class="s" x="210" y="98" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">v3/ upload-date folders only</text></g>
<line x1="210" y1="116" x2="210" y2="148" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="152" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text class="t" x="210" y="172" text-anchor="middle" dominant-baseline="central" fill="#3C3489">download.py</text><text class="s" x="210" y="190" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Last 7 days nightly, full recheck monthly</text></g>
<line x1="210" y1="208" x2="210" y2="240" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="244" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text class="t" x="210" y="264" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">raw/</text><text class="s" x="210" y="282" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Every file (CSV + JSON), never moved</text></g>
<line x1="210" y1="300" x2="210" y2="332" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="336" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text class="t" x="210" y="356" text-anchor="middle" dominant-baseline="central" fill="#3C3489">load.py</text><text class="s" x="210" y="374" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Pitch CSVs: validate, add base state</text></g>
<line x1="210" y1="392" x2="210" y2="424" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="428" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text class="t" x="210" y="448" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">games/</text><text class="s" x="210" y="466" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">One parquet per game</text></g>
<line x1="210" y1="484" x2="210" y2="516" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="520" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text class="t" x="210" y="540" text-anchor="middle" dominant-baseline="central" fill="#3C3489">build.py</text><text class="s" x="210" y="558" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Rebuild changed years + RE288</text></g>
<line x1="210" y1="576" x2="210" y2="608" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="612" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text class="t" x="210" y="632" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">serving/</text><text class="s" x="210" y="650" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Year folders, read by models + app</text></g>
<line x1="210" y1="668" x2="210" y2="700" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="704" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text class="t" x="210" y="724" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Model artifacts</text><text class="s" x="210" y="742" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Re-score nightly, retrain monthly</text></g>
<line x1="210" y1="760" x2="210" y2="792" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="60" y="796" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text class="t" x="210" y="816" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">delispice_app</text><text class="s" x="210" y="834" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Warm caches, graceful reload</text></g>

<g><rect x="420" y="60" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-dasharray="4 3"/><text class="t" x="560" y="80" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">config.py</text><text class="s" x="560" y="98" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Every path, shared with the app</text></g>
<line x1="360" y1="180" x2="420" y2="180" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="360" y1="364" x2="420" y2="364" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="360" y1="548" x2="420" y2="548" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<g><rect x="420" y="152" width="280" height="424" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text class="t" x="560" y="180" text-anchor="middle" dominant-baseline="central" fill="#085041">pipeline.db</text><text class="s" x="560" y="200" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">The ledger (SQLite)</text><text class="s" x="560" y="330" text-anchor="middle" dominant-baseline="central" fill="#085041">files: every file and its status</text><text class="s" x="560" y="360" text-anchor="middle" dominant-baseline="central" fill="#085041">games: current version of each game</text><text class="s" x="560" y="390" text-anchor="middle" dominant-baseline="central" fill="#085041">runs: what ran, with counts</text></g>
<line x1="560" y1="576" x2="560" y2="608" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="420" y="612" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/><text class="t" x="560" y="632" text-anchor="middle" dominant-baseline="central" fill="#712B13">What you see</text><text class="s" x="560" y="650" text-anchor="middle" dominant-baseline="central" fill="#993C1D">status, pipeline page, Discord</text></g>
<path d="M360 650 L390 650 L390 732 L416 732" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<g><rect x="420" y="704" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text class="t" x="560" y="724" text-anchor="middle" dominant-baseline="central" fill="#3C3489">heights service</text><text class="s" x="560" y="742" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Always on, writes heights.csv</text></g>
<path d="M560 760 L560 824 L364 824" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="60" y="874" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text class="s" x="78" y="880" dominant-baseline="central" fill="#5F5E5A">Script</text>
<rect x="140" y="874" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/><text class="s" x="158" y="880" dominant-baseline="central" fill="#5F5E5A">Folder or file</text>
<rect x="268" y="874" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/><text class="s" x="286" y="880" dominant-baseline="central" fill="#5F5E5A">Ledger</text>
<rect x="346" y="874" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D"/><text class="s" x="364" y="880" dominant-baseline="central" fill="#5F5E5A">What you see</text>
<line x1="470" y1="880" x2="500" y2="880" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/><text class="s" x="508" y="880" dominant-baseline="central" fill="#5F5E5A">Records to the ledger</text>
